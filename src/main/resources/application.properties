spring.application.name=RepairLoop

spring.datasource.url=jdbc:postgresql://localhost:5432/repairloop_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
logging.level.org.springframework.security=DEBUG
logging.level.com.repairloop.config.JwtAuthenticationFilter=DEBUG
logging.level.com.repairloop.controller.RepairRequestController=DEBUG
logging.level.org.springframework.web=DEBUG